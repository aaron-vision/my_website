<script async defer src="https://buttons.github.io/buttons.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var token = '[[EN]]';
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node || !node.nodeValue || !node.nodeValue.includes(token)) return NodeFilter.FILTER_REJECT;
        var p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        var tag = p.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(function (node) {
      var raw = node.nodeValue;
      var parts = raw.split(token);
      if (parts.length !== 2) return;

      var left = parts[0].trim();
      var right = parts[1].trim();
      if (!left || !right) return;

      var frag = document.createDocumentFragment();
      frag.appendChild(document.createTextNode(left));
      frag.appendChild(document.createElement('br'));
      frag.appendChild(document.createTextNode(right));
      node.parentNode.replaceChild(frag, node);
    });
  });
</script>
